{% extends 'base.html' %}

{% block title %}{{ webinar.title }} - Live Room{% endblock %}

{% block content %}
<div style="height: calc(100vh - 60px); display: flex; flex-direction: column;">
    
    <!-- Jitsi Meeting -->
    <div id="jitsi-container" style="flex: 1; background: #000;"></div>
    
    <!-- Controls -->
    <div style="padding: 1rem; background: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
        <h3 style="color: var(--text-primary);">{{ webinar.title }}</h3>
        <a href="{% url 'webinars:detail' webinar.slug %}" 
           style="padding: 0.5rem 1.5rem; background: var(--accent-color); color: white; text-decoration: none; border-radius: 6px;">
            Leave Room
        </a>
    </div>
</div>

<script src="https://meet.jit.si/external_api.js"></script>
<script>
    const domain = '{{ webinar.jitsi_server|default:"https://meet.jit.si" }}';
    const options = {
        roomName: '{{ webinar.room_name }}',
        width: '100%',
        height: '100%',
        parentNode: document.querySelector('#jitsi-container'),
        userInfo: {
            displayName: '{{ user.get_full_name|default:user.username }}',
            email: '{{ user.email }}'
        },
        configOverwrite: {
            startWithAudioMuted: true,
            startWithVideoMuted: false,
            disableDeepLinking: true
        },
        interfaceConfigOverwrite: {
            TOOLBAR_BUTTONS: [
                'microphone', 'camera', 'closedcaptions', 'desktop',
                'fullscreen', 'fodeviceselection', 'hangup', 'profile',
                'chat', 'recording', 'livestreaming', 'etherpad', 'sharedvideo',
                'settings', 'raisehand', 'videoquality', 'filmstrip',
                'invite', 'feedback', 'stats', 'shortcuts', 'tileview',
                'videobackgroundblur', 'download', 'help', 'moder-everyone',
                'security'
            ]
        }
    };
    
    const api = new JitsiMeetExternalAPI(domain, options);
    
    // Track when user leaves
    window.addEventListener('beforeunload', function() {
        fetch('{% url "webinars:leave" session.id %}', {
            method: 'POST',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}'
            }
        });
    });
</script>
{% endblock %}
