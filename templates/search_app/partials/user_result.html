<div style="display: flex; align-items: center; gap: 1rem; padding: 0.75rem; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px;">
    <div style="width: 50px; height: 50px; border-radius: 50%; background: var(--accent-color); display: flex; align-items: center; justify-content: center; color: white;">
        {{ user.username|first|upper }}
    </div>
    <div style="flex: 1;">
        <a href="{% url 'accounts:profile_detail' user.username %}" style="color: var(--text-primary); text-decoration: none; font-weight: 600;">
            {{ user.get_full_name|default:user.username }}
        </a>
        <p style="color: var(--text-secondary); font-size: 0.875rem;">@{{ user.username }}</p>
    </div>
    <a href="{% url 'chat:start' user.id %}" style="padding: 0.5rem 1rem; background: var(--accent-color); color: white; text-decoration: none; border-radius: 20px; font-size: 0.875rem;">
        Message
    </a>
</div>
